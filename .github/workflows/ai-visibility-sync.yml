# Keeps the Ad Studio AI visibility pages on GitHub Pages in step with the cloud run.
# The run itself happens in the Cloudflare Worker ocl-aivis (1st of the month, 04:43 UTC; retries on the 2nd to the
# 4th). This job only copies the Worker's published pages into the same paths here, using the built-in GITHUB_TOKEN:
#   ai-visibility/ad-studio/index.html, citations/index.html, latest.txt, latest.json     (the latest run)
#   ai-visibility/ad-studio/<YYYY-MM-DD>/index.html, <YYYY-MM-DD>/citations/index.html   (its archive)
# then asks for a Pages build and checks every URL returns 200 with exactly the Worker's bytes (up to 15 minutes).
# Nothing changes when the pages already match, so extra runs are harmless.
name: AI visibility sync

on:
  schedule:
    - cron: "30 6 1 * *"   # the 1st, 06:30 UTC: after the Worker's 04:43 UTC run
    - cron: "30 6 2-4 * *" # the 2nd to the 4th: picks up a run the Worker retried that morning
  workflow_dispatch:
    inputs:
      run:
        description: "Archive date to fetch (YYYY-MM-DD). Empty: the Worker's latest run."
        required: false
        default: ""

permissions:
  contents: write
  pages: write

concurrency:
  group: ai-visibility-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORKER: https://ocl-aivis.winningstatics.workers.dev/ai-visibility/ad-studio
      SITE: https://farooqchisty-hub.github.io/oneclick-launch-build/ai-visibility/ad-studio
      SUB: ai-visibility/ad-studio
      ARCHIVE_INPUT: ${{ inputs.run }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the Worker's pages
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 10 "$WORKER/latest.json" -o /tmp/latest.json
          RUN=$(python3 -c 'import json; print(json.load(open("/tmp/latest.json"))["run"])')
          ARCH="${ARCHIVE_INPUT:-$RUN}"
          for d in "$RUN" "$ARCH"; do
            [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "not a run date: $d" >&2; exit 1; }
          done
          # fetch URL FILE RUN: the page must name its run and hold no em or en dash, like publish.sh checked
          fetch() {
            curl -fsS --retry 3 --retry-delay 10 "$1" -o "$2.tmp"
            python3 - "$2.tmp" "$3" <<'PY'
          import sys
          path, run = sys.argv[1:3]
          t = open(path, encoding="utf-8").read()
          if "—" in t or "–" in t:
              sys.exit(f"{path}: contains an em or en dash")
          if 'name="ai-visibility-run"' in t and f'content="{run}"' not in t:
              sys.exit(f"{path}: rendered for another run than {run}")
          PY
            mkdir -p "$(dirname "$2")"
            mv "$2.tmp" "$2"
            echo "$1|$2" >> /tmp/pairs
          }
          : > /tmp/pairs
          fetch "$WORKER/$ARCH/" "$SUB/$ARCH/index.html" "$ARCH"
          fetch "$WORKER/$ARCH/citations/" "$SUB/$ARCH/citations/index.html" "$ARCH"
          CUR=$(cat "$SUB/latest.txt" 2>/dev/null || true)
          if [ -n "$CUR" ] && [[ "$CUR" > "$RUN" ]]; then
            echo "latest stays at $CUR (newer than $RUN)"
          else
            fetch "$WORKER/" "$SUB/index.html" "$RUN"
            fetch "$WORKER/citations/" "$SUB/citations/index.html" "$RUN"
            echo "$RUN" > "$SUB/latest.txt"
            cp /tmp/latest.json "$SUB/latest.json"
          fi
          echo "RUN=$RUN" >> "$GITHUB_ENV"
          echo "ARCH=$ARCH" >> "$GITHUB_ENV"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$SUB"
          if git diff --cached --quiet; then
            echo "Pages already match the Worker (run $RUN); nothing to commit."
            echo "CHANGED=0" >> "$GITHUB_ENV"
          else
            git commit -q -m "Ad Studio AI visibility: run $RUN (synced from the ocl-aivis Worker)"
            git pull -q --rebase origin main
            git push -q origin HEAD:main
            echo "CHANGED=1" >> "$GITHUB_ENV"
            git log --oneline -1
          fi

      - name: Request a Pages build
        if: env.CHANGED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || echo "build request refused; the push triggers one anyway"

      - name: Check every URL returns 200 with the Worker's bytes
        run: |
          set -uo pipefail
          SITE_ROOT="https://farooqchisty-hub.github.io/oneclick-launch-build"
          deadline=$(( $(date +%s) + 900 ))
          while :; do
            bad=0
            while IFS='|' read -r src file; do
              url="$SITE_ROOT/${file%index.html}"
              code=$(curl -s -o /tmp/got -w '%{http_code}' "$url?v=$(date +%s)$RANDOM" || echo 000)
              if [ "$code" != "200" ] || ! cmp -s /tmp/got "$file"; then bad=$((bad + 1)); echo "not yet: $url ($code)"; fi
            done < /tmp/pairs
            [ $bad -eq 0 ] && break
            if [ "$(date +%s)" -ge $deadline ]; then echo "NOT LIVE after 15 minutes" >&2; exit 1; fi
            sleep 20
          done
          echo "LIVE (200, bytes match the Worker):"
          while IFS='|' read -r src file; do echo "  $SITE_ROOT/${file%index.html}"; done < /tmp/pairs
